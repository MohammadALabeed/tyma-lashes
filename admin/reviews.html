<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>إدارة التقييمات | Tyma Lashes</title>
        <script
            src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <style>
    :root { color-scheme: light; font-family: "Tajawal", "Cairo", sans-serif; color: #231624; background: #faf7f9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, #faf7f9, #f4ebf6); }
    .shell { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 56px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .topbar a { color: #8f7287; font-weight: 700; text-decoration: none; }
    h1 { margin: 0; font-size: 1.65rem; }
    .panel { border: 1px solid #e8dbe6; border-radius: 16px; background: #fff; box-shadow: 0 12px 30px rgba(163,136,155,.1); padding: 24px; }
    .login-panel { max-width: 440px; margin: 8vh auto; }
    .field { display: grid; gap: 7px; margin: 16px 0; font-weight: 700; }
    input { width: 100%; border: 1px solid #e8dbe6; border-radius: 10px; padding: 12px 14px; background: #faf7f9; font: inherit; }
    button { border: 0; border-radius: 10px; padding: 11px 16px; background: #a3889b; color: white; font: inherit; font-weight: 700; cursor: pointer; transition: background .2s, transform .2s; }
    button:hover { background: #8f7287; transform: translateY(-1px); }
    button:disabled { opacity: .6; cursor: wait; transform: none; }
    .secondary { border: 1px solid #e8dbe6; background: white; color: #6b546d; }
    .secondary:hover { background: #f4ebf6; color: #231624; }
    .status { min-height: 24px; margin: 12px 0; color: #6b546d; }
    .status.error { color: #a13636; }
    .review-list { display: grid; gap: 12px; margin-top: 20px; }
    .review-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; border: 1px solid #e8dbe6; border-radius: 12px; padding: 18px; background: #fff; }
    .review-copy { min-width: 0; }
    .review-heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .review-heading strong { font-size: 1rem; }
    .review-date { color: #766b76; font-size: .82rem; }
    .review-stars { color: #b17b00; white-space: nowrap; }
    .review-comment { margin: 0; line-height: 1.7; overflow-wrap: anywhere; }
    .delete-button { flex: 0 0 auto; background: #a83a45; }
    .delete-button:hover { background: #842833; }
    [hidden] { display: none !important; }
    @media (max-width: 560px) {
      .shell { width: min(100% - 24px, 960px); padding-top: 20px; }
      .panel { padding: 18px; }
      .review-row { padding: 14px; gap: 12px; }
      .delete-button { padding: 9px 11px; }
      h1 { font-size: 1.35rem; }
    }
  </style>
    </head>
    <body>
        <main class="shell">
            <header class="topbar">
                <h1>إدارة تقييمات Tyma Lashes</h1>
                <a href="/admin/">العودة إلى لوحة التحكم</a>
            </header>
            <section id="login-panel" class="panel login-panel">
                <h2>تسجيل دخول المشرف</h2>
                <form id="login-form">
                    <label class="field">البريد الإلكتروني
                        <input name="email" type="email" autocomplete="username"
                            required />
                    </label>
                    <label class="field">كلمة المرور
                        <input name="password" type="password"
                            autocomplete="current-password" required />
                    </label>
                    <button id="login-button" type="submit">تسجيل
                        الدخول</button>
                </form>
                <p id="login-status" class="status" role="status"
                    aria-live="polite"></p>
            </section>
            <section id="admin-panel" class="panel" hidden>
                <div class="topbar">
                    <div>
                        <h2>التقييمات المنشورة</h2>
                        <p id="admin-identity" class="status"></p>
                    </div>
                    <button id="logout-button" class="secondary"
                        type="button">تسجيل الخروج</button>
                </div>
                <p id="admin-status" class="status" role="status"
                    aria-live="polite"></p>
                <div id="review-list" class="review-list"></div>
            </section>
        </main>
        <script>
    const client = window.supabase.createClient(
      'https://adrxhaodoqndwdjwcuda.supabase.co',
      'sb_publishable_OCfPLSslBei4jfu99pX-DA_BKmoaCJG'
    );
    const loginPanel = document.getElementById('login-panel');
    const adminPanel = document.getElementById('admin-panel');
    const loginStatus = document.getElementById('login-status');
    const adminStatus = document.getElementById('admin-status');
    const reviewList = document.getElementById('review-list');
    const loginButton = document.getElementById('login-button');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
    }

    function setStatus(element, message, isError = false) {
      element.textContent = message;
      element.classList.toggle('error', isError);
    }

    async function loadReviews() {
      setStatus(adminStatus, 'جارٍ تحميل التقييمات...');
      const { data, error } = await client
        .from('reviews')
        .select('id,name,comment,rating,created_at')
        .order('created_at', { ascending: false });
      if (error) {
        setStatus(adminStatus, 'تعذر تحميل التقييمات. تحقق من إعداد RLS في ملف الإعداد.', true);
        return;
      }
      if (!data.length) {
        reviewList.innerHTML = '';
        setStatus(adminStatus, 'لا توجد تقييمات حالياً.');
        return;
      }
      setStatus(adminStatus, `${data.length} تقييمات`);
      reviewList.innerHTML = data.map(review => {
        const date = review.created_at ? new Intl.DateTimeFormat('ar', { dateStyle: 'medium' }).format(new Date(review.created_at)) : '';
        return `<article class="review-row">
          <div class="review-copy">
            <div class="review-heading"><strong>${escapeHtml(review.name)}</strong><span class="review-date">${escapeHtml(date)}</span><span class="review-stars" aria-label="${Number(review.rating)} من 5">${'★'.repeat(Math.max(0, Math.min(5, Number(review.rating) || 0)))}${'☆'.repeat(5 - Math.max(0, Math.min(5, Number(review.rating) || 0)))}</span></div>
            <p class="review-comment">${escapeHtml(review.comment)}</p>
          </div>
          <button class="delete-button" type="button" data-delete-id="${escapeHtml(review.id)}">حذف</button>
        </article>`;
      }).join('');
    }

    async function showSession(session) {
      if (!session) {
        loginPanel.hidden = false;
        adminPanel.hidden = true;
        return;
      }
      loginPanel.hidden = true;
      adminPanel.hidden = false;
      document.getElementById('admin-identity').textContent = session.user.email || '';
      const { data, error } = await client
        .from('review_admins')
        .select('user_id')
        .eq('user_id', session.user.id)
        .maybeSingle();
      if (error || !data) {
        reviewList.innerHTML = '';
        setStatus(adminStatus, `هذا الحساب غير مخول لإدارة التقييمات. أضف UUID التالي إلى public.review_admins عبر SQL Editor: ${session.user.id}`, true);
        return;
      }
      await loadReviews();
    }

    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      loginButton.disabled = true;
      setStatus(loginStatus, 'جارٍ تسجيل الدخول...');
      const formData = new FormData(event.currentTarget);
      const { data, error } = await client.auth.signInWithPassword({
        email: String(formData.get('email') || '').trim(),
        password: String(formData.get('password') || '')
      });
      loginButton.disabled = false;
      if (error) {
        setStatus(loginStatus, 'تعذر تسجيل الدخول. تحقق من بيانات الحساب.', true);
        return;
      }
      await showSession(data.session);
    });

    document.getElementById('logout-button').addEventListener('click', async () => {
      await client.auth.signOut();
      await showSession(null);
    });

    reviewList.addEventListener('click', async event => {
      const button = event.target.closest('[data-delete-id]');
      if (!button || !window.confirm('هل تريد حذف هذا التقييم؟')) return;
      button.disabled = true;
      setStatus(adminStatus, 'جارٍ حذف التقييم...');
      const { data, error } = await client
        .from('reviews')
        .delete()
        .eq('id', button.dataset.deleteId)
        .select('id');
      if (error || !data?.length) {
        button.disabled = false;
        setStatus(adminStatus, 'لم يُحذف التقييم. تحقق من صلاحية المشرف وسياسات RLS.', true);
        return;
      }
      await loadReviews();
    });

    client.auth.getSession().then(({ data }) => showSession(data.session));
  </script>
    </body>
</html>
